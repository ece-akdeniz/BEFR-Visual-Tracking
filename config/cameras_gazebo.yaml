# Camera layout for live Gazebo + square_ctrl (typical altitude z ≈ 3–8 m).
# Offline experiments keep using config/cameras.yaml at z = 1.5 m.

image:
  width: 640
  height: 480

intrinsics:
  fx: 320.0
  fy: 320.0
  cx: 320.0
  cy: 240.0

noise:
  sigma_u: 1.0
  sigma_v: 1.0
  quantize: true
  detection_probability: 1.0

world:
  frame_id: world
  flight_volume_center: [0.0, 0.0, 5.0]
  up: [0.0, 0.0, 1.0]
  reference_camera_id: camera_0

cameras:
  - id: camera_0
    frame_id: camera_0_optical_frame
    position: [0.0, -8.0, 5.0]
    look_at: [0.0, 0.0, 5.0]
    orientation_xyzw: [0.0, 0.70710678, 0.70710678, 0.0]

  - id: camera_1
    frame_id: camera_1_optical_frame
    position: [8.0, 0.0, 5.0]
    look_at: [0.0, 0.0, 5.0]
    orientation_xyzw: [-0.5, 0.5, 0.5, -0.5]

  - id: camera_2
    frame_id: camera_2_optical_frame
    position: [-8.0, 0.0, 5.0]
    look_at: [0.0, 0.0, 5.0]
    orientation_xyzw: [0.5, 0.5, 0.5, 0.5]

  - id: camera_3
    frame_id: camera_3_optical_frame
    position: [6.0, 6.0, 8.5]
    look_at: [0.0, 0.0, 5.0]
    orientation_xyzw: [0.78022746, -0.3231808, -0.20494092, 0.49477116]
